# En las pruebas se usa H2 en memoria (modo MySQL), así no hace falta tener MySQL encendido
spring:
  datasource:
    url: jdbc:h2:mem:catalogo;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

# JWT: la misma clave en los tres microservicios (se puede cambiar con la variable de entorno JWT_SECRETO)
jwt:
  secreto: ${JWT_SECRETO:AppMuseo-DSY1105-clave-de-firma-JWT-Museo-de-los-Museos-2026}
  minutos: ${JWT_MINUTOS:120}
