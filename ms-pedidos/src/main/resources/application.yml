server:
  port: 8083

spring:
  application:
    name: ms-pedidos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/museo_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:museo2026}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# dirección del microservicio de catálogo (precios y stock)
catalogo:
  url: ${CATALOGO_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# JWT: la misma clave en los tres microservicios (se puede cambiar con la variable de entorno JWT_SECRETO)
jwt:
  secreto: ${JWT_SECRETO:AppMuseo-DSY1105-clave-de-firma-JWT-Museo-de-los-Museos-2026}
  minutos: ${JWT_MINUTOS:120}
